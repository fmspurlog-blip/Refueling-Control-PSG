<!doctype html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#071a33'><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='style.css'><title>Refueling Control</title></head><body>
<header class='hero'><img src='hero.png' alt='Refueling Control'><div class='hero-mask' aria-hidden='true'></div><div class='net' id='net'>ONLINE</div></header>
<main>
<section id='home' class='page active'><div class='device-card'>PERANGKAT: <b id='deviceLabel'>-</b> &nbsp;•&nbsp; FUELMAN ID: <b id='fuelmanIdLabel'>-</b></div><div class='card'><h2>START SHIFT</h2><label>Fuelman ID<input id='fuelmanId' placeholder='FM01'></label><label>Nama Fuelman<input id='fuelman' placeholder='Nama Fuelman'></label><label>Shift<select id='shift'><option>DAY</option><option>NIGHT</option></select></label><label>Fuel Truck<select id='truck'><option>FT04</option><option>FT05</option></select></label><label>HM/KM Awal Fuel Truck<input id='truckHmStart' inputmode='decimal' placeholder='Masukkan HM/KM Awal'></label><button onclick='startShift()'>MULAI SHIFT</button></div><div class='stats'><div><b id='pendingN'>0</b><span>Pending Sync</span></div><div><b id='todayN'>0</b><span>Transaksi Hari Ini</span></div></div></section>
<section id='tx' class='page'><div class='card'><h2>TRANSAKSI REFUELING</h2><div class='step'>1. IDENTITAS UNIT</div><label>Kode Unit<input id='unit' placeholder='EXVV35G007'></label><label>HM/KM Before<input id='before' inputmode='decimal' placeholder='0.00'></label><label>HM/KM Current<input id='current' inputmode='decimal' placeholder='0.00'></label><div class='step'>2. EMPAT FOTO WAJIB</div><div class='photos'>
<label>① Kode Unit<input id='pUnit' type='file' accept='image/*' capture='environment'><span id='sUnit'>BELUM</span></label>
<label>② HM/KM<input id='pHm' type='file' accept='image/*' capture='environment'><span id='sHm'>BELUM</span></label>
<label>③ Flowmeter 0<input id='pZero' type='file' accept='image/*' capture='environment'><span id='sZero'>BELUM</span></label>
<label>④ Flowmeter Akhir<input id='pEnd' type='file' accept='image/*' capture='environment'><span id='sEnd'>BELUM</span></label></div>
<label>Flowmeter Awal (L)<input id='flow0' inputmode='decimal' value='0'></label><label>Flowmeter Akhir / Fuel Issued (L)<input id='flowEnd' inputmode='decimal' placeholder='0.00'></label><div id='calc' class='summary'></div><button onclick='saveTx()'>SIMPAN TRANSAKSI</button><button class='secondary' onclick="show('home')">BATAL</button></div></section>
<section id='history' class='page'><div class='card'><h2>RIWAYAT</h2><div class='actions'><button id='syncBtn' onclick='syncNow()'>SYNC SEKARANG</button><button class='secondary' onclick='exportCSV()'>EXPORT CSV</button></div><div id='rows'></div></div></section><div id='detailModal' class='modal'><div class='modal-box'><div class='modal-head'><h2>DETAIL TRANSAKSI</h2><button class='secondary' onclick='closeDetail()'>✕</button></div><div id='detailBody'></div></div></div>
</main><nav><button onclick="show('home')">HOME</button><button onclick="show('tx')">REFUEL</button><button onclick="show('history')">RIWAYAT</button></nav><script src='app.js?v=1.4.1'></script></body></html>
